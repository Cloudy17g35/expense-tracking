[project]
name = "expense-bot"
version = "0.1.0"
description = "Bot Telegram zapisujący wydatki domowe w Google Sheets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gspread>=6.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bot"]
plugins = ["pydantic.mypy"]
