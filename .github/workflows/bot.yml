name: Bot

on:
  schedule:
    # Co 5 minut, z przesunięciem od pełnych godzin (:02, :07, ...), bo na początku każdej
    # godziny GitHub jest najbardziej obciążony i najczęściej opóźnia lub pomija crony.
    # Opóźnienia kilku-kilkunastu minut są normalne.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Nigdy dwa uruchomienia naraz: drugie czeka, aż pierwsze skończy.
concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
      USERS: ${{ secrets.USERS }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Opcjonalnie: zmienna repozytorium CLAUDE_MODEL (Settings → Variables), np. claude-haiku-5-5
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
    steps:
      - name: Sprawdź konfigurację
        id: config
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$ALLOWED_CHAT_ID" ] || [ -z "$USERS" ]; then
            echo "::notice::Brak sekretów TELEGRAM_TOKEN / ALLOWED_CHAT_ID / USERS - pomijam."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: astral-sh/setup-uv@v6
        if: steps.config.outputs.ready == 'true'
        with:
          enable-cache: true
      - name: Uruchom bota
        if: steps.config.outputs.ready == 'true'
        run: uv run --locked --no-dev python -m bot
