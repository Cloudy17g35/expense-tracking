name: Keepalive

# GitHub wyłącza zaplanowane workflowy w publicznym repo po 60 dniach bez commitów.
# Raz w miesiącu ponownie je włączamy przez API (bez pustych commitów).
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh workflow enable bot.yml
          gh workflow enable keepalive.yml
